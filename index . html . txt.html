 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Interactive Galaxy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        .title {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);

            color: white;
            font-size: 32px;
            font-weight: bold;

            pointer-events: none;
            z-index: 10;
        }

        .title span {
            color: #9bdc55;
        }

        .info {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            color: rgba(255,255,255,0.6);
            font-size: 14px;

            pointer-events: none;
        }
    </style>
</head>


<body>

<div class="title">
    Interactive <span>Galaxy</span>
</div>

<div class="info">
    Move your mouse • Drag on mobile • Scroll to zoom
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// ======================================================
// SCENE
// ======================================================

const scene = new THREE.Scene();


// ======================================================
// CAMERA
// ======================================================

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.z = 13;


// ======================================================
// RENDERER
// ======================================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);


// ======================================================
// GALAXY SETTINGS
// ======================================================

const particleCount = 100000;

const galaxyRadius = 10;

const numberOfArms = 6;

const armSpread = 0.20;

const rotationSpeed = 0.0015;


// ======================================================
// PARTICLE ARRAYS
// ======================================================

const positions =
    new Float32Array(
        particleCount * 3
    );

const colors =
    new Float32Array(
        particleCount * 3
    );


// ======================================================
// GALAXY COLORS
// ======================================================

const centerColor =
    new THREE.Color("#d9ff7a");

const middleColor =
    new THREE.Color("#70c8a0");

const outerColor =
    new THREE.Color("#5c5ca8");


// ======================================================
// CREATE GALAXY
// ======================================================

for (let i = 0; i < particleCount; i++) {

    const i3 = i * 3;


    // Distance from center
    const radius =
        Math.pow(
            Math.random(),
            1.7
        ) * galaxyRadius;


    // Select spiral arm
    const arm =
        (i % numberOfArms) /
        numberOfArms *
        Math.PI * 2;


    // Spiral rotation
    const spiral =
        radius * 1.6;


    // Random movement
    const random =
        (Math.random() - 0.5) *
        armSpread *
        (radius / galaxyRadius);


    const angle =
        arm + spiral + random;


    // ==================================================
    // X POSITION
    // ==================================================

    positions[i3] =
        Math.cos(angle) * radius;


    // ==================================================
    // Y POSITION
    // ==================================================
    positions[i3 + 1] =
        (Math.random() - 0.5) *
        0.5 *
        (1 - radius / galaxyRadius);


    // ==================================================
    // Z POSITION
    // ==================================================

    positions[i3 + 2] =
        Math.sin(angle) * radius;


    // ==================================================
    // COLOR
    // ==================================================

    const distance =
        radius / galaxyRadius;


    let particleColor;


    if (distance < 0.35) {

        particleColor =
            centerColor.clone().lerp(
                middleColor,
                distance / 0.35
            );

    } else {

        particleColor =
            middleColor.clone().lerp(
                outerColor,
                (distance - 0.35) / 0.65
            );
    }


    colors[i3] =
        particleColor.r;

    colors[i3 + 1] =
        particleColor.g;

    colors[i3 + 2] =
        particleColor.b;
}


// ======================================================
// GEOMETRY
// ======================================================

const geometry =
    new THREE.BufferGeometry();


geometry.setAttribute(
    "position",

    new THREE.BufferAttribute(
        positions,
        3
    )
);


geometry.setAttribute(
    "color",

    new THREE.BufferAttribute(
        colors,
        3
    )
);


// ======================================================
// MATERIAL
// ======================================================

const material =
    new THREE.PointsMaterial({

        size: 0.035,

        vertexColors: true,

        transparent: true,

        opacity: 0.9,

        depthWrite: false,

        blending:
            THREE.AdditiveBlending
    });


// ======================================================
// GALAXY OBJECT
// ======================================================

const galaxy =
    new THREE.Points(
        geometry,
        material
    );


scene.add(galaxy);


// ======================================================
// MOUSE
// ======================================================

let mouseX = 0;

let mouseY = 0;

let targetRotationX = 0;

let targetRotationY = 0;


window.addEventListener(
    "mousemove",
    (event) => {

        mouseX =
            event.clientX /
            window.innerWidth - 0.5;

        mouseY =
            event.clientY /
            window.innerHeight - 0.5;

        targetRotationY =
            mouseX * 0.7;

        targetRotationX =
            mouseY * 0.4;
    }
);


// ======================================================
// TOUCH
// ======================================================

let touchStartX = 0;

let touchStartY = 0;


window.addEventListener(
    "touchstart",
    (event) => {

        touchStartX =
            event.touches[0].clientX;

        touchStartY =
            event.touches[0].clientY;
    }
);


window.addEventListener(
    "touchmove",
    (event) => {

        const touch =
            event.touches[0];

        const differenceX =
            touch.clientX -
            touchStartX;

        const differenceY =
            touch.clientY -
            touchStartY;


        targetRotationY +=
            differenceX * 0.002;

        targetRotationX +=
            differenceY * 0.001;


        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;
    }
);


// ======================================================
// ZOOM
// ======================================================

window.addEventListener(
    "wheel",
    (event) => {

        camera.position.z +=
            event.deltaY * 0.005;


        camera.position.z =
            Math.max(
                6,
                Math.min(
                    25,
                    camera.position.z
                )
            );
    }
);


// ======================================================
// ANIMATION
// ======================================================

function animate() {

    requestAnimationFrame(
        animate
    );
     // Automatic galaxy rotation
    galaxy.rotation.y +=
        rotationSpeed;


    // Smooth mouse movement
    galaxy.rotation.x +=
        (targetRotationX -
        galaxy.rotation.x) *
        0.03;


    galaxy.rotation.z +=
        (targetRotationY -
        galaxy.rotation.z) *
        0.03;


    renderer.render(
        scene,
        camera
    );
}


animate();


// ======================================================
// WINDOW RESIZE
// ======================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>

</html>
